name = "christmasidea"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# The website (site/ folder) is served by this same Worker.
# Every request runs the Worker first so www can be redirected and security headers added.
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# christmasidea.co.uk and www both point at this Worker; www is redirected to the main domain in code.
[[routes]]
pattern = "christmasidea.co.uk"
custom_domain = true

[[routes]]
pattern = "www.christmasidea.co.uk"
custom_domain = true

# Plain settings. Secrets (API keys) are set with `npx wrangler secret put`, never here.
[vars]
CANONICAL_HOST = "christmasidea.co.uk"
# Exact origins allowed to call the API (no trailing slash).
ALLOWED_ORIGINS = "https://christmasidea.co.uk,https://www.christmasidea.co.uk,capacitor://localhost,https://localhost"
# Claude model. Haiku 5.5 is the cheapest; "claude-sonnet-5-5" gives richer ideas at about 20x the cost.
MODEL = "claude-haiku-5-5"
MAX_OUTPUT_TOKENS = "4500"
CLAUDE_EFFORT = "low"
RECOMMENDATION_MODE = "baseline-v3.3"
# Reviewed feedback policies only; collecting feedback does not automatically change global ranking.
LEARNING_RANKING_ENABLED = "false"
# Requires an approved, fresh knowledge-policy.js release; otherwise Claude behavior is unchanged.
KNOWLEDGE_REUSE_ENABLED = "true"
# Hard cap on AI searches per day across all visitors (resets 00:00 UTC). Above it the Worker uses the checked catalogue fallback.
DAILY_AI_LIMIT = "500"
# Per-visitor caps (visitor = hashed IP, rotated daily; raw IPs are never stored).
PER_VISITOR_DAILY_LIMIT = "15"
PER_VISITOR_MINUTE_LIMIT = "4"
# Global kill switch; each merchant also needs its own approval, flag and credentials.
PRODUCT_DISCOVERY_ENABLED = "true"
PRODUCT_PHOTO_FIRST = "true"
AMAZON_PRODUCT_DISCOVERY_ENABLED = "false"
EBAY_PRODUCT_DISCOVERY_ENABLED = "true"
AMAZON_PARTNER_TAG = "mcstarrstud0c-21"
AWIN_PRODUCT_DISCOVERY_ENABLED = "false"
AWIN_PUBLISHER_ID = "3146453"
AWIN_IMAGE_HOSTS = ""
# Public production App ID; the Cert ID is stored only as the EBAY_CLIENT_SECRET Worker secret.
EBAY_CLIENT_ID = "CallumSt-SantasHe-PRD-5a2eef3be-4793a07b"
EBAY_CAMPAIGN_ID = "5339240592"
PRODUCT_API_TIMEOUT_MS = "8000"
PRODUCT_SEARCH_DAILY_LIMIT = "4000"
PRODUCT_SEARCH_HOURLY_LIMIT = "1000"
# Reserve a whole gift batch; searches execute with concurrency 2. Restore Amazon's confirmed limit before enabling it.
PRODUCT_SEARCH_PER_SECOND_LIMIT = "32"
PRODUCT_SEARCH_PER_VISITOR_DAILY_LIMIT = "240"
PRODUCT_SEARCH_PER_VISITOR_MINUTE_LIMIT = "64"
PRODUCT_MATCH_HIGH_THRESHOLD = "0.78"
PRODUCT_MATCH_MEDIUM_THRESHOLD = "0.55"

[[d1_databases]]
binding = "AWIN_CATALOG"
database_name = "christmasidea-awin-catalogue"
database_id = "300da640-1232-422b-9a00-0f41144ef4ae"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetCounter"

# SQLite-backed Durable Objects are the kind available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetCounter"]

[observability]
enabled = true

[triggers]
crons = ["0 3 * * *"]
