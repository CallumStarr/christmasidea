name: Refresh Awin product catalogue

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awin-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate required secrets
        run: |
          test -n "$AWIN_DATAFEEDS_API_KEY" || { echo "::error::Add AWIN_DATAFEEDS_API_KEY as a GitHub Actions secret."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret."; exit 1; }
        env:
          AWIN_DATAFEEDS_API_KEY: ${{ secrets.AWIN_DATAFEEDS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply catalogue schema migrations
        run: npx wrangler d1 migrations apply christmasidea-awin-catalogue --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Import all joined UK Awin-format feeds
        run: npm run awin:sync -- --database christmasidea-awin-catalogue --remote
        env:
          AWIN_DATAFEEDS_API_KEY: ${{ secrets.AWIN_DATAFEEDS_API_KEY }}
          AWIN_PUBLISHER_ID: ${{ vars.AWIN_PUBLISHER_ID || '3146453' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
