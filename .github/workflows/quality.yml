name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: git diff --exit-code -- site
      - run: npm run build:app
      - run: npx --no-install wrangler deploy --dry-run
      - run: npm run benchmark:replay:v3.3
      - run: npm run benchmark:replay:v3.4
